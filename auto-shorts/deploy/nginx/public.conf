# Auto Shorts — хост редиректора (u.<домен>): лендинг /{code}, /go/{code}/tg|site, приём конверсий
# /ingest/v1/events, /health, /robots.txt. Всё проксируется на public 127.0.0.1:18302.
# docs/ARCHITECTURE.md §2.1, §5.3, §8.5.
#
# Установка — как admin.conf (deploy/README.md):
#   sudo install -m 0644 deploy/nginx/snippets/autoshorts-*.conf /etc/nginx/snippets/
#   sudo install -m 0644 deploy/nginx/public.conf /etc/nginx/sites-available/autoshorts-public.conf
#   заменить u.example.com на свой хост; certbot; ln -s в sites-enabled; nginx -t; reload
# Если 80/443 держит Coolify/Traefik, маршрут заводится через Traefik с тем же набором заголовков (§8.5).
#
# Чего здесь НЕТ намеренно:
#   * Content-Security-Policy. Лендинг ставит свой CSP (default-src 'none' + sha256 скрипта, §5.3);
#     второй заголовок от nginx браузер применил бы вместе с первым и сломал бы скрипт лендинга.
#   * IP в access-логе. Журнал кликов хранит только visitor_key (HMAC дня, IP и UA), сырые IP
#     зрителей не пишем и сюда (формат autoshorts_public_noip). Ошибки nginx адрес всё же пишет.

limit_req_zone $binary_remote_addr zone=autoshorts_public:10m rate=30r/s;

log_format autoshorts_public_noip '[$time_local] "$request_method $uri $server_protocol" $status '
                                  '$body_bytes_sent rt=$request_time urt=$upstream_response_time rid=$request_id';

server {
    listen 80;
    listen [::]:80;
    server_name u.example.com;
    server_tokens off;
    access_log /var/log/nginx/autoshorts-public.access.log autoshorts_public_noip;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    # Адрес с плашки набирают руками: http → https с сохранением кода
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name u.example.com;
    server_tokens off;
    absolute_redirect off;

    ssl_certificate     /etc/letsencrypt/live/u.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/u.example.com/privkey.pem;
    include snippets/autoshorts-tls.conf;

    access_log /var/log/nginx/autoshorts-public.access.log autoshorts_public_noip;
    error_log  /var/log/nginx/autoshorts-public.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Защита от залпов с одного адреса. Порог с запасом: за мобильным CGNAT сидят тысячи зрителей.
    limit_req zone=autoshorts_public burst=60 nodelay;
    limit_req_status 429;

    # Тело нужно только приёму конверсий; остальным маршрутам хватает мелочи
    client_max_body_size 16k;

    # Браузер просит favicon на каждом лендинге — не гоняем это в приложение и в журнал
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Приём конверсий (HMAC, тело ≤ 256 КБ, ≤ 100 событий; подпись и лимиты проверяет приложение)
    location = /ingest/v1/events {
        include snippets/autoshorts-proxy.conf;
        proxy_pass http://127.0.0.1:18302;
        client_max_body_size 256k;
        proxy_read_timeout 30s;
        error_page 413 = @ingest_too_large;
        error_page 502 504 = @ingest_unavailable;
    }

    location / {
        include snippets/autoshorts-proxy.conf;
        proxy_pass http://127.0.0.1:18302;
        proxy_read_timeout 15s;
        error_page 502 504 = @landing_unavailable;
    }

    location @ingest_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Тело запроса больше 256 КБ","details":{}}}';
    }
    location @ingest_unavailable {
        default_type application/json;
        add_header Retry-After "60" always;
        return 503 '{"error":{"code":"not_ready","message":"Приём событий временно недоступен, повторите позже","details":{}}}';
    }
    # Зритель не должен видеть «502 Bad Gateway»: короткая страница без внешних ресурсов
    location @landing_unavailable {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        return 503 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Скоро вернёмся</title></head><body style="font-family:system-ui,sans-serif;margin:3rem auto;max-width:28rem;padding:0 1rem;text-align:center"><h1 style="font-size:1.4rem">Ссылка временно недоступна</h1><p>Обновите страницу через минуту.</p></body></html>';
    }
}
