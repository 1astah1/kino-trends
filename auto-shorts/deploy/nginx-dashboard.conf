# Nginx-конфиг для дашборда под поддоменом. Вариант А: отдельный поддомен (проще, рекомендуется —
# HTTP Basic Auth дашборда независим от auth основного сайта umka.chat).
#
# Установка:
#   1. Прописать A-запись admin.umka.chat -> IP этого VPS-воркера (или того же сервера, где сайт,
#      если дашборд крутится рядом — порт 18234 слушает только 127.0.0.1, наружу не торчит).
#   2. sudo cp deploy/nginx-dashboard.conf /etc/nginx/sites-available/autoshorts-dashboard
#   3. sudo ln -s /etc/nginx/sites-available/autoshorts-dashboard /etc/nginx/sites-enabled/
#   4. sudo certbot --nginx -d admin.umka.chat   (получить TLS-сертификат)
#   5. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name admin.umka.chat;

    location / {
        proxy_pass http://127.0.0.1:18234;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
