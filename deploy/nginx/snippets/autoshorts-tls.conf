# TLS-параметры server-блоков Auto Shorts на 443. Сертификаты задаются в самих server-блоках
# (ssl_certificate / ssl_certificate_key), обычно certbot: certbot certonly --webroot -w /var/www/letsencrypt -d <хост>.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:autoshorts_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
