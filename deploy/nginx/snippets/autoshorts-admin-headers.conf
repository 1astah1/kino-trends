# Заголовки безопасности admin-хоста Auto Shorts (docs/ARCHITECTURE.md §7.7, §8.5).
# add_header из server не наследуется в location, где есть свой add_header, поэтому этот файл
# подключается и на уровне server, и в каждом location с собственными заголовками.
#
# CSP совпадает с §7.7 и с web/scripts/serve-static.mjs (e2e гоняет Playwright с тем же заголовком).
# 'unsafe-inline' в script-src нужен инлайн-скриптам RSC-payload статического экспорта Next.js.
# Ноль внешних источников: шрифты, иконки и графики лежат в /_next/static (§7.7).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# микрофон — только своему origin: запись голоса оператора для авторского слоя (§11.2 п. 13)
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
