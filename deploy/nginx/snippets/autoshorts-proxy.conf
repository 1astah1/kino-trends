# Общие заголовки проксирования на процессы Auto Shorts (127.0.0.1:18300 api, :18302 public).
# Подключается внутри location (include snippets/autoshorts-proxy.conf;): proxy_set_header из server
# в location с собственными proxy_set_header не наследуется, поэтому набор держится в одном месте.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# X-Forwarded-For перезаписывается адресом клиента, а не дописывается: подделанный клиентом заголовок
# не доходит до приложения (uvicorn --proxy-headers доверяет только 127.0.0.1).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# сквозной идентификатор запроса для логов (§8.5): одинаковый в access-логе nginx и в JSON-логе api
proxy_set_header X-Request-ID $request_id;
proxy_redirect off;
proxy_connect_timeout 5s;
