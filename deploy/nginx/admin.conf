# Auto Shorts — admin-хост: операторская консоль (статический экспорт Next.js), API и защищённые медиа.
# docs/ARCHITECTURE.md §2.1, §5.1, §7.1, §7.7, §8.5.
#
#   /                   → /opt/auto-shorts/web/out (статика, try_files, CSP 'self', ноль внешних ресурсов)
#   /api/               → api 127.0.0.1:18300 (JSON, лимит тела 40 МБ)
#   SSE                 → /api/v1/events/stream, /api/v1/tasks/<id>/log/stream без буферизации, 1 ч
#   tus                 → /api/v1/uploads/tus чанками по 16 МБ, без буферизации запроса
#   креативы баннера    → POST /api/v1/banner-creatives multipart до 51 МБ, без буферизации запроса
#   /_protected_media/  → internal: отдаёт MEDIA_ROOT только по X-Accel-Redirect из api (Range, sendfile)
#
# Установка (nginx на хосте держит 80/443; если их держит Coolify/Traefik — см. deploy/README.md):
#   sudo install -m 0644 deploy/nginx/snippets/autoshorts-*.conf /etc/nginx/snippets/
#   sudo install -m 0644 deploy/nginx/admin.conf /etc/nginx/sites-available/autoshorts-admin.conf
#   заменить admin.example.com на свой хост (server_name и пути сертификата)
#   sudo install -d /var/www/letsencrypt && sudo certbot certonly --webroot -w /var/www/letsencrypt -d <хост>
#   sudo ln -s ../sites-available/autoshorts-admin.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# nginx читает медиа от своего пользователя: sudo usermod -aG autoshorts www-data (каталоги 0750, файлы 0640).
#
# Файл подключается внутри http {} (sites-enabled), поэтому зоны и формат лога объявлены здесь же.
# Имена с префиксом autoshorts_, чтобы не пересечься с соседними сайтами на том же nginx.

# Вход: вторая линия обороны поверх лимитов приложения (5 попыток в минуту на IP, §5.1)
limit_req_zone $binary_remote_addr zone=autoshorts_login:1m rate=10r/m;

log_format autoshorts_admin '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                            'rt=$request_time urt=$upstream_response_time rid=$request_id "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 (Ubuntu 24.04): http2 в listen; с 1.25.1 можно заменить на отдельную директиву «http2 on;»
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    include snippets/autoshorts-tls.conf;

    access_log /var/log/nginx/autoshorts-admin.access.log autoshorts_admin;
    error_log  /var/log/nginx/autoshorts-admin.error.log warn;

    # Доступ только из доверенных сетей или VPN (§8.5) — по решению владельца (§11.2 п. 1):
    # allow 203.0.113.10;
    # allow 10.8.0.0/24;
    # deny all;

    root /opt/auto-shorts/web/out;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    # Заголовки безопасности для всех ответов (в том числе /api/ и медиа)
    include snippets/autoshorts-admin-headers.conf;

    # ───────────── статический экспорт Next.js ─────────────

    # Хешированные чанки, стили и шрифты fontsource: вечный кеш
    location ^~ /_next/static/ {
        include snippets/autoshorts-admin-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Страницы и RSC-payload (.txt): всегда перепроверять, иначе после выкладки браузер держит старую оболочку
    location / {
        include snippets/autoshorts-admin-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include snippets/autoshorts-admin-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ───────────── API ─────────────

    location /api/ {
        include snippets/autoshorts-proxy.conf;
        proxy_pass http://127.0.0.1:18300;
        client_max_body_size 40m;
        proxy_read_timeout 120s;
        error_page 502 504 = @api_unavailable;
        error_page 413 = @payload_too_large;
    }

    location = /api/v1/auth/login {
        limit_req zone=autoshorts_login burst=5 nodelay;
        limit_req_status 429;
        include snippets/autoshorts-proxy.conf;
        proxy_pass http://127.0.0.1:18300;
        client_max_body_size 16k;
        error_page 429 = @rate_limited;
        error_page 502 504 = @api_unavailable;
        error_page 413 = @payload_too_large;
    }

    # SSE: без буферизации и сжатия, соединение живёт до часа (ping раз в 15 с, §5.1)
    location ~ ^/api/v1/(events/stream|tasks/[0-9]+/log/stream)$ {
        include snippets/autoshorts-proxy.conf;
        proxy_pass http://127.0.0.1:18300;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
        error_page 502 504 = @api_unavailable;
    }

    # tus 1.0.0: чанки по 16 МБ идут в api потоком, без промежуточного файла nginx
    location ^~ /api/v1/uploads/tus {
        include snippets/autoshorts-proxy.conf;
        proxy_pass http://127.0.0.1:18300;
        client_max_body_size 40m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        error_page 502 504 = @api_unavailable;
        error_page 413 = @payload_too_large;
    }

    # Загрузка креатива баннера (M2, решение владельца 2026-09-26): multipart до 50 МБ
    # (MAX_CREATIVE_UPLOAD_BYTES) + запас на заголовки частей; тело идёт в api потоком
    location = /api/v1/banner-creatives {
        include snippets/autoshorts-proxy.conf;
        proxy_pass http://127.0.0.1:18300;
        client_max_body_size 51m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        error_page 413 = @payload_too_large;
        error_page 502 504 = @api_unavailable;
    }

    # ───────────── медиа через X-Accel-Redirect ─────────────
    # api проверяет права и отвечает X-Accel-Redirect: /_protected_media/<relpath> (§5.1); nginx отдаёт файл
    # с Range (206/416) и sendfile. Content-Type, Content-Disposition и Cache-Control приходят из ответа api.
    # Снаружи location недоступен (internal → 404).
    location ^~ /_protected_media/ {
        internal;
        alias /var/lib/autoshorts/media/;
        sendfile on;
        tcp_nopush on;
        gzip off;
    }

    # ───────────── ответы nginx в формате ошибок API (§5.1) ─────────────
    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"not_ready","message":"API недоступен, повторите через минуту","details":{}}}';
    }
    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Слишком большой запрос","details":{}}}';
    }
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Слишком много попыток входа, подождите минуту","details":{}}}';
    }
}
