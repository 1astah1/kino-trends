# Профиль ресурсов dedicated_small (docs/ARCHITECTURE.md §8.1): отдельный VPS 2 vCPU / 4 ГБ / 50 ГБ,
# соседей нет — тяжёлому воркеру отдаётся вся машина, кроме запаса под api/public/light и PostgreSQL.
# Ставится только вместе с RESOURCE_PROFILE=dedicated_small в /opt/auto-shorts/.env:
#   install -D -m 0644 10-resource-profile.conf /etc/systemd/system/autoshorts-worker-heavy.service.d/10-resource-profile.conf
#   systemctl daemon-reload && systemctl restart autoshorts-worker-heavy
# Пустое значение сбрасывает настройку базового юнита (shared_dev).
[Service]
Nice=5
CPUWeight=
CPUQuota=
MemoryHigh=infinity
MemoryMax=3G
IOReadBandwidthMax=
IOWriteBandwidthMax=
