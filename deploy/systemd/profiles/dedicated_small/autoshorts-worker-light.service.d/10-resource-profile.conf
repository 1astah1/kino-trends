# Профиль ресурсов dedicated_small (docs/ARCHITECTURE.md §8.1): лёгкий воркер с тремя слотами.
# Ставится только вместе с RESOURCE_PROFILE=dedicated_small в /opt/auto-shorts/.env:
#   install -D -m 0644 10-resource-profile.conf /etc/systemd/system/autoshorts-worker-light.service.d/10-resource-profile.conf
#   systemctl daemon-reload && systemctl restart autoshorts-worker-light
# AS_LIGHT_CONCURRENCY, заданный в .env, важнее этого значения.
[Service]
Environment=AS_LIGHT_CONCURRENCY=3
