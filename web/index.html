<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кино-тренды Shorts</title>
<meta name="description" content="Какие фильмы и сериалы режут на YouTube Shorts для русскоязычной аудитории и как это заходит">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2a33a'/%3E%3Cpath d='M12 9v14l11-7z' fill='%231a1206'/%3E%3C/svg%3E">
<link rel="preload" href="static/fonts/Onest-400-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="static/fonts/Unbounded-700-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/styles.css">
</head>
<body>
<a class="skip" href="#main">К содержимому</a>
<header class="top">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M12 9v14l11-7z"/></svg>
    <span class="brand-name">Кино-тренды <span class="brand-sub">Shorts · СНГ</span></span>
  </div>
  <nav class="nav" aria-label="Разделы">
    <a href="#/today" data-route="today">Сегодня</a>
    <a href="#/videos" data-route="videos">Видео</a>
    <a href="#/pipeline" data-route="pipeline">Конвейер</a>
    <a href="#/cut" data-route="kino">Кино</a>
    <a href="#/collect" data-route="collect">Сбор</a>
  </nav>
  <div class="top-right">
    <span id="run-pill" class="pill pill-quiet" title="Состояние сбора">…</span>
    <button id="help-btn" class="icon-btn" type="button" aria-label="Помощь" title="Как пользоваться">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7"/><circle cx="12" cy="17" r=".6"/></svg>
    </button>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Переключить тему" title="Тема">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="filters" id="filters" role="region" aria-label="Фильтры кино" hidden>
  <button class="btn btn-sm filters-toggle" id="filters-toggle" type="button" aria-expanded="false">фильтры</button>
  <button class="help" type="button" data-help="period" aria-label="Что такое период">?</button>
  <div class="seg" role="group" aria-label="Период">
    <button type="button" data-period="7">7 дней</button>
    <button type="button" data-period="30">30 дней</button>
    <button type="button" data-period="90">90 дней</button>
    <button type="button" data-period="all">всё</button>
  </div>
  <div class="seg" role="group" aria-label="Язык роликов">
    <button type="button" data-lang="all">все языки</button>
    <button type="button" data-lang="ru">русский</button>
    <button type="button" data-lang="en">английский</button>
  </div>
  <button class="help" type="button" data-help="lang" aria-label="Про язык">?</button>
  <label class="fld">уверенность от
    <select id="f-conf" aria-label="Минимальная уверенность распознавания">
      <option value="0.5">0,5</option><option value="0.6" selected>0,6</option><option value="0.7">0,7</option><option value="0.8">0,8</option><option value="0.9">0,9</option>
    </select>
  </label>
  <button class="help" type="button" data-help="conf" aria-label="Про уверенность">?</button>
  <label class="fld">просмотров от
    <select id="f-views" aria-label="Минимум просмотров">
      <option value="0">0</option><option value="10000">10 тыс.</option><option value="100000">100 тыс.</option><option value="1000000">1 млн</option>
    </select>
  </label>
  <button class="help" type="button" data-help="min_views" aria-label="Про порог просмотров">?</button>
  <span class="filters-note" id="filters-note"></span>
</div>

<main id="main" class="main" tabindex="-1"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<script src="static/app.js"></script>
</body>
</html>
